<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nastavi geslo — Delomer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="main-header">
  <div class="logo">
    <a href="/"><img class="logo" src="logo.png" alt="Delomer" title="Delomer logo"></a>
  </div>
</header>

<main class="main-content">
<div class="container">

  <div id="invite-box" class="box active">
    <h2>Nastavi geslo</h2>

    <p id="inviteInfo">Preverjam povabilo...</p>

    <input id="new-password" type="password" placeholder="Novo geslo">
    <div id="passwordError" class="error"></div>

    <button id="activateBtn">Aktiviraj račun</button>
  </div>

</div>
</main>

<footer class="main-footer">
  <p>© 2026 Delomer</p>
</footer>

<script src="set-password.js"></script>
</body>
</html>
