<!DOCTYPE html>
<html>
<head>
  <title>Delomer
  </title>
  <style>
    body { font-family: Arial; background:#0f172a; color:white; text-align:center; }
    input, button { margin:5px; padding:8px; }
    table { margin:auto; margin-top:20px; border-collapse: collapse; }
    td, th { padding:10px; border:1px solid white; }
  </style>
</head>
<body>

<h1>Tiktak</h1>

<!-- REGISTER -->
<h2>Register</h2>
<input id="regEmail" placeholder="email">
<input id="regPass" type="password" placeholder="password">
<button onclick="register()">Register</button>

<!-- LOGIN -->
<h2>Login</h2>
<input id="logEmail" placeholder="email">
<input id="logPass" type="password" placeholder="password">
<button onclick="login()">Login</button>

<!-- WORK -->

<h2>Add Work</h2>
<input id="task" placeholder="task">
<br>
<label>Start:</label>
<input id="start" type="datetime-local">
<label>End:</label>
<input id="end" type="datetime-local">
<br>
<button onclick="addWork()">Add</button>


<h2>Work logs</h2>
<table id="table">
  <tr>
    <th>User</th>
    <th>Task</th>
    <th>Hours</th>
  </tr>
</table>

<script>
let token = "";

// REGISTER
async function register() {
  await fetch('http://localhost:3000/api/users/register', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      email: regEmail.value,
      password: regPass.value
    })
  });

  alert("Registered!");
}

// LOGIN
async function login() {
  const res = await fetch('http://localhost:3000/api/users/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      email: logEmail.value,
      password: logPass.value
    })
  });

  const data = await res.json();
  token = data.token;

  alert("Logged in!");
  loadWork();
}

// ADD WORK
async function addWork() {
  await fetch('http://localhost:3000/api/work', {
    method: 'POST',
    headers: {
      'Content-Type':'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify({
      task: task.value,
      started_at: start.value,
      ended_at: end.value
    })
  });

  loadWork();
}


// LOAD DATA
async function loadWork() {
  const res = await fetch('http://localhost:3000/api/work', {
    headers: {
      'Authorization': 'Bearer ' + token
    }
  });

  const data = await res.json();

  const table = document.getElementById('table');

    table.innerHTML = `
    <tr>
        <th>User</th>
        <th>Task</th>
        <th>Start</th>
        <th>End</th>
        <th>Total</th>
    </tr>
    `;



data.forEach(row => {
  const hours = (row.minutes / 60).toFixed(2);

  table.innerHTML += `
    <tr>
      <td>${row.email}</td>
      <td>${row.task}</td>
      <td>${new Date(row.started_at).toLocaleString()}</td>
      <td>${new Date(row.ended_at).toLocaleString()}</td>
      <td>${hours} h</td>
    </tr>
  `;
});


  
// auto set start time to now
window.onload = () => {
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());

  document.getElementById('start').value = 
    now.toISOString().slice(0,16);
};

}
</script>

</body>
</html>
