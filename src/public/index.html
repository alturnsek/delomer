<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <title>Delomer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="loading">
  
<header class="main-header">
  <div class="logo">
    <a href="/"><img class="logo" src="logo.png" alt="Delomer" title="Delomer logo"></a> 
  </div>
  
  <div class="header-right">
    <div class="inline">
      <span id="headerUser">Pozdravljen, uporabnik</span>      
    </div>
  <button id="headerLogout">Odjava</button>
  </div>

</header>


<div id="loader">
  <div class="spinner"></div>
</div>
<main class="main-content">
<div class="container">

  <!-- LOGIN -->

<div id="login-box" class="box active">
  <h2>Prijava</h2>

  <form id="loginForm">
    <input id="login-email" type="email" placeholder="Email">
    <div id="loginEmailError" class="error"></div>
    <input id="login-password" type="password" placeholder="Geslo">
    <div id="loginPasswordError" class="error"></div>

    <div id="loginGeneralError" class="error"></div>

    <button type="submit" id="loginBtn">Prijava</button>
  </form>


    <!-- Google login začasno skrit
    <div class="separator">ali</div>
    <a href="/api/users/auth/google" class="social">
      Nadaljuj z Google
    </a>
    -->

    <p class="switch">
      Nimaš računa?
      <span id="goRegister">Registriraj se</span>
    </p>
  </div>


  <!-- REGISTER STEP 1 -->
  <div id="register-step1" class="box">
    <h2>Registracija</h2>

    
    <input id="reg-email" type="email" placeholder="Email">
    <div id="emailError" style="color:red; font-size:12px;"></div>

    <input id="reg-password" type="password" placeholder="Geslo">
    <div id="passwordError" style="color:red; font-size:12px;"></div>

    <button id="regStep1Btn">Naprej</button>

    <p class="switch">
      Že imaš račun?
      <span id="goLogin">Nazaj na prijavo</span>
    </p>
  </div>


  <!-- REGISTER STEP 2 -->
  <div id="register-step2" class="box">
    <h2>Še malo...</h2>

    <input id="first_name" placeholder="Ime">
    <input id="last_name" placeholder="Priimek">
    <input placeholder="Društvo (placeholder)">

    <button id="regStep2Btn">Zaključi registracijo</button>
  </div>

</div>


<!--APP -->
<div id="app" class="hidden">

  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>Vnos dela</h2>
  </div>


    <div class="work-form">
      <div class="field">
        <input id="task" placeholder="Kaj si delal?" maxlength="255" rows="3">
        <div id="taskCount">0 / 255</div>
      </div>

      <div class="field">
        <label>Začetek dela</label>
        <input id="start" type="datetime-local">
      </div>

      <div class="field">
        <label>Konec dela</label>
        <input id="end" type="datetime-local">
      </div>

      <button id="addWorkBtn">+ Dodaj</button>
    </div>


  <ul id="workList"></ul>

</div>
<div id="confirmModal" class="hidden">
  <div class="confirm-box">
    <p>Ali res želiš izbrisati vnos?</p>
    <div class="confirm-actions">
      <button id="confirmYes">Izbriši</button>
      <button id="confirmNo">Prekliči</button>
    </div>
  </div>
</div>
</main>
<footer class="main-footer">
  <p>© 2026 Delomer — CI/CD test v1</p>
  <p>Kontakt: aleksander.turnsek@student.um.si</p>
</footer>

<script src="script.js"></script>
</body>
</html>
