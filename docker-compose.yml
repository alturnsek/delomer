services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ${DOCKERHUB_USERNAME:-delomer}/delomer:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default
      - npm_proxy
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  deploy-webhook:
    build:
      context: .
      dockerfile: deploy/Dockerfile.webhook
    restart: unless-stopped
    environment:
      DEPLOY_WEBHOOK_SECRET: ${DEPLOY_WEBHOOK_SECRET}
      WEBHOOK_PORT: 9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:ro
    networks:
      - npm_proxy

networks:
  npm_proxy:
    external: true
    name: ${NPM_NETWORK_NAME:-npm_proxy}

volumes:
  db_data:
  uploads_data:
