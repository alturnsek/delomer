<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <title>Delomer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="loading">
  
<header class="main-header">
  <div class="logo">
    <a href="/"><img class="logo" src="logo.png" alt="Delomer" title="Delomer logo"></a> 
  </div>
  
  <div class="header-right">
    <div class="inline">
      <span id="headerUser">Pozdravljen, uporabnik</span>      
    </div>
  <button id="headerLogout">Odjava</button>
  </div>

</header>


<div id="loader">
  <div class="spinner"></div>
</div>
<main class="main-content">
<div class="container">

  <!-- LOGIN -->

<div id="login-box" class="box active">
  <h2>Prijava</h2>

  <form id="loginForm">
    <input id="login-email" type="email" placeholder="Email">
    <div id="loginEmailError" class="error"></div>
    <input id="login-password" type="password" placeholder="Geslo">
    <div id="loginPasswordError" class="error"></div>

    <div id="loginGeneralError" class="error"></div>

    <button type="submit" id="loginBtn">Prijava</button>
  </form>


    <!-- Google login začasno skrit
    <div class="separator">ali</div>
    <a href="/api/users/auth/google" class="social">
      Nadaljuj z Google
    </a>
    -->
  </div>

</div>


<!--APP -->
<div id="app" class="hidden">

  <!-- SUPER ADMIN: DRUŠTVA -->
  <div id="superadminSection" class="hidden">
    <h2>Društva</h2>

    <div class="work-form">
      <input id="newOrgName" placeholder="Ime društva">
      <input id="newOrgAdminFirst" placeholder="Ime admina">
      <input id="newOrgAdminLast" placeholder="Priimek admina">
      <input id="newOrgAdminEmail" type="email" placeholder="Email admina">
      <button id="createOrgBtn">Ustvari društvo</button>
      <div id="createOrgMsg" class="error"></div>
    </div>

    <ul id="orgList"></ul>
  </div>

  <!-- ADMIN: ČLANI DRUŠTVA -->
  <div id="adminSection" class="hidden">
    <h2>Društvo — člani</h2>

    <div class="work-form">
      <input id="inviteFirst" placeholder="Ime">
      <input id="inviteLast" placeholder="Priimek">
      <input id="inviteEmail" type="email" placeholder="Email">
      <button id="inviteUserBtn">Povabi člana</button>
      <div id="inviteMsg" class="error"></div>
    </div>

    <div class="work-form">
      <label>Bulk uvoz — ena vrstica na osebo: <code>Ime,Priimek,Email</code></label>
      <textarea id="bulkInviteText" rows="5" placeholder="Janez,Novak,janez@primer.si"></textarea>
      <button id="bulkInviteBtn">Povabi vse</button>
      <div id="bulkInviteMsg" class="error"></div>
    </div>

    <ul id="orgMembersList"></ul>
  </div>

  <div id="workSection">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>Vnos dela</h2>
    </div>


    <div class="work-form">
      <div class="field">
        <input id="task" placeholder="Kaj si delal?" maxlength="255" rows="3">
        <div id="taskCount">0 / 255</div>
      </div>

      <div class="field">
        <label>Začetek dela</label>
        <input id="start" type="datetime-local">
      </div>

      <div class="field">
        <label>Konec dela</label>
        <input id="end" type="datetime-local">
      </div>

      <button id="addWorkBtn">+ Dodaj</button>
    </div>


    <ul id="workList"></ul>
  </div>

</div>
<div id="confirmModal" class="hidden">
  <div class="confirm-box">
    <p>Ali res želiš izbrisati vnos?</p>
    <div class="confirm-actions">
      <button id="confirmYes">Izbriši</button>
      <button id="confirmNo">Prekliči</button>
    </div>
  </div>
</div>
</main>
<footer class="main-footer">
  <p>© 2026 Delomer — CI/CD test v1</p>
  <p>Kontakt: aleksander.turnsek@student.um.si</p>
</footer>

<script src="script.js"></script>
</body>
</html>
